name: CI

# Controls when the workflow will run
on:
  # Allows the release workflow to require a successful CI run
  workflow_call:

  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - '.github/ISSUE_TEMPLATE'
      - '.github/workflows/release.yml'
      - 'toolbox/*.mlx'
      
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:  
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Cache MATLAB build files
        uses: actions/cache@v5
        with:
          key: matlab-buildtool-${{ runner.os }}
          path: |
            .buildtool

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          cache: true

      - name: Run MATLAB build
        uses: matlab-actions/run-build@v3

      - name: Upload SARIF file
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: code-issues/results.sarif
          # Optional category for the results
          # Used to differentiate multiple results for one commit
          category: matlab-${{ runner.os }}

  compatibility-r2020b:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up MATLAB R2020b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2020b
          cache: true

      - name: Run compatibility tests
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: toolbox
          select-by-folder: tests
          select-by-tag: Unit
          test-results-junit: r2020b-test-results.xml