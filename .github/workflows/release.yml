name: Publish MPM package and toolbox release

# Run workflow when a tag is created
on:
  push:
    tags: 
      - 'v*'
      
jobs:
  ci:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/main.yml
   
  package-artifacts:
    needs: ci
    permissions:
      contents: write
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out repo
        uses: actions/checkout@v6
          
      - name: Set up MATLAB R2024b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      - name: Build MPM and toolbox artifacts
        uses: matlab-actions/run-build@v3
        with:
          tasks: release
          build-options: -prune check -prune test -prune packagingTest

      - name: Archive MPM and toolbox artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-artifacts
          if-no-files-found: error
          path: |
            vcpkg-wrapper-toolbox-v*_mpm.zip
            vcpkg-wrapper-toolbox-v*.mltbx
      
      # Create new release
      - name: Create a new release
        uses: softprops/action-gh-release@v3
        with:
          name: '${{  github.ref_name }}'
          files: |
            vcpkg-wrapper-toolbox-v*_mpm.zip
            vcpkg-wrapper-toolbox-v*.mltbx
          fail_on_unmatched_files: true
          generate_release_notes: true
